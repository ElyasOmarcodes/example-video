            act.split(/\s+/).forEach((a) => {
              switch (a) {
                case "move": tl.to(el, { x: n("x", 0), y: n("y", 0), rotation: n("r", 0), duration: n("d", 0.9), ease: IO, ...org }, T); if (Math.abs(n("x", 0)) > 80) cue(T, "paper_quick", -8); break;
                case "float": tl.to(el, { y: -n("y", 8), duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 1, 1.3) }, t0 + 0.9); break;
                case "pulse": tl.to(el, { scale: n("s", 1.08), transformOrigin: "50% 50%", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - T - 0.6, 0.7) | 1 }, T + 0.5); break;
                case "blink": tl.to(el, { opacity: 0.25, duration: n("d", 0.5), ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 0.4, n("d", 0.5)) | 1 }, t0 + 0.4); break;
                case "fade": tl.to(el, { opacity: n("o", 0.3), duration: 0.6 }, T); break;
                case "fall": tl.to(el, { y: n("y", 200), rotation: 24, opacity: 0.2, duration: 0.9, ease: "power2.in", transformOrigin: "50% 50%" }, T); break;
                case "droop": tl.to(el, { y: n("y", 0), rotation: n("r", 0), duration: 1.0, ease: "bounce.out", ...org }, T); break;
                case "tug": tl.fromTo(el, { x: -n("x", 14) }, { x: n("x", 14), duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 0.6, 0.75) }, t0 + 0.6); break;
                case "tilt": tl.fromTo(el, { rotation: -n("r", 4), ...org }, { rotation: n("r", 4), duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 0.3, 1.2), ...org }, t0 + 0.3); break;
                case "tilt1": tl.to(el, { rotation: n("r", -12), duration: 1.4, ease: "elastic.out(1, 0.5)", ...org }, T); cue(T, "metal_woosh", -10); break;
                case "spin": tl.to(el, { rotation: n("r", 360), duration: t1 - t0, ease: "none", transformOrigin: "50% 50%" }, t0); break;
                case "spinstop": tl.to(el, { rotation: n("r", 60), duration: Math.max(0.5, T - t0), ease: "power2.out", transformOrigin: "50% 50%" }, t0); tl.to(el, { rotation: "+=4", duration: 0.05, yoyo: true, repeat: 5 }, T); cue(T, "metal_woosh", -10); break;
                case "shake": tl.to(el, { x: "+=10", duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, T); break;
                case "stamp": tl.to(el, { y: n("y", 60), duration: 0.16, ease: "power3.in", yoyo: true, repeat: 1 }, T - 0.16); cue(T, "wood_hit", -4); break;
                case "strike": { const k = Math.max(1, Math.floor(span / 1.1)); for (let i = 0; i < k; i++) { tl.to(el, { rotation: n("r", -24), duration: 0.14, ease: "power2.in", yoyo: true, repeat: 1, ...org }, s + 0.4 + i * 1.1); cue(s + 0.54 + i * 1.1, "wood_hit", -5); } break; }
                case "domino": tl.to(el, { rotation: 64, duration: 0.42, ease: "power2.in", ...org }, T); cue(T + 0.38, "tw_hit", -6); break;
                case "ripple": tl.fromTo(el, { scale: 1, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 5, opacity: 0, duration: 1.4, ease: "power1.out" }, T); break;
                case "march": el.querySelectorAll("path,line").forEach((p) => tl.fromTo(p, { strokeDashoffset: 0 }, { strokeDashoffset: -40 * (t1 - t0), duration: t1 - t0, ease: "none" }, t0)); break;
                case "flutter": tl.fromTo(el, { skewY: -3, scaleX: 0.97 }, { skewY: 3, scaleX: 1.02, transformOrigin: "0% 50%", duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0, 0.7) }, t0); break;
                case "globe": tl.fromTo(el, { x: -n("r", 100) * 0.4 }, { x: n("r", 100) * 0.4, duration: t1 - t0, ease: "none" }, t0); break;
                case "needle": tl.fromTo(el, { rotation: -150, svgOrigin: o }, { rotation: -20, duration: 0.6, ease: OUT, svgOrigin: o }, t0 + 0.5); tl.to(el, { rotation: -170, duration: 1.4, ease: "power2.in", svgOrigin: o }, T); break;
                case "flash": tl.fromTo(el, { opacity: 0 }, { opacity: 0.85, duration: 0.05, yoyo: true, repeat: 1 }, T); cue(T, "shutter", -6); break;
              }
            });
            const sx = g("sfx", null);
            if (sx) cue(g("t", null) != null ? T : t0 + n("at", 0.1), sx, n("db", -6));
          });
        }

        // ---------- shared builders ----------
        function stag(p, sec, n, N) {
          const s = mk("div", "stag", p);
          mk("b", "", s, null, SEC[sec]);
          if (n) mk("span", "", s, null, FA(n) + " له " + FA(N));
          return s;
        }
        function heading(p, text, n, t0, big) {
          const h = mk("div", "head" + (n ? "" : " solo"), p, big ? { top: 200 } : null);
          let num = null;
          if (n) num = mk("div", "num", h, null, FA(n));
          const tx = mk("div", "ttx", h, null, text);
          const base = big ? 110 : 66, maxW = n ? 700 : 860;
          let fs = Math.min(base, Math.floor((base * maxW) / measure(text, 900, base)));
          if (fs < 52) { fs = 56; tx.style.maxWidth = "760px"; }
          tx.style.fontSize = fs + "px";
          if (num) tl.fromTo(num, { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.4, ease: EXPO }, t0 + 0.02);
          tl.fromTo(tx, { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: EXPO }, t0 + 0.12);
          return h;
        }
        function caption(p, text, spans, top) {
          const c = mk("div", "cap", p, top ? { top } : null);
          const tx = mk("div", "tx", c);
          const ws = wordsInto(tx, text);
          if (text.length > 95) tx.style.fontSize = "46px";
          speak(ws, spans);
          return c;
        }
        function prog(p, n, N, t0) {
          const r = mk("div", "prog", p);
          for (let i = 1; i <= N; i++) {
            const it = mk("i", i < n ? "past" : i === n ? "cur" : "", r);
            if (i === n) tl.fromTo(it, { scaleX: 0.1, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.7, ease: OUT }, t0 + 0.15);
          }
        }
        function stage(p, inner, t0, t1) {
          const s = svg(p, inner, null, "stage");
          tl.fromTo(s, { scale: 1 }, { scale: 1.045, transformOrigin: "50% 60%", duration: t1 - t0, ease: "none" }, t0);
          return s;
        }

        // ---------- scenes ----------
        function buildItem(c, sc) {
          stag(c, sc.sec, sc.n, sc.N);
          heading(c, sc.head, sc.n, sc.t0);
          const st = stage(c, SCENES[sc.icon](), sc.t0, sc.t1);
          animate(st, sc.t0 + 0.12, sc.s, sc.e, sc.t1);
          caption(c, sc.text, [[sc.s, sc.e]]);
          prog(c, sc.n, sc.N, sc.t0);
        }
        function buildIntro(c, sc) {
          const t = mk("div", "title", c);
          const ws = wordsInto(t, sc.text);
          ws.forEach((w) => { if (/اختلاف|عوامل/.test(w.textContent)) w.classList.add("k"); });
          const k = mk("div", "kick", c, { top: 1600 }, "<span>۱۴ عوامل · ۱۴ پایلې · ۱۰ پېښې</span>");
          const st = svg(c, SCENES.intro(), "0 60 1000 820", "stage", { top: 600, height: 960 });
          animate(st, 0, 0.3, 4.1, sc.t1);
          tl.fromTo(ws, { y: 0 }, { y: -6, duration: 0.4, stagger: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.1);
          tl.fromTo(k, { scale: 1 }, { scale: 1.04, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.5);
          cue(1.9, "glass_break", -10);
        }
        function buildDiv(c, sc) {
          stag(c, sc.sec);
          const bn = mk("div", "bignum", c, null, FA(sc.sec));
          tl.fromTo(bn, { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 0.25, duration: 1.4, ease: EXPO }, sc.t0);
          heading(c, sc.head, 0, sc.t0 + 0.05, true);
          const st = stage(c, SCENES[sc.icon](), sc.t0, sc.t1);
          st.style.top = "380px";
          animate(st, sc.t0 + 0.2, sc.s, sc.e, sc.t1);
          caption(c, sc.text, [[sc.s, sc.e]]);
          cue(sc.t0 + 0.05, "deep_impact", -10);
        }
        function buildConcl(c, sc) {
          const t0 = sc.t0, TB = 223.55;
          heading(c, sc.head, 0, t0, true);
          const K = KIT, Cc = K.C;
          const minis = {
            crown: K.crown(200, 230, 1.25), cash: K.cash(200, 270, 220, 6), gem: K.P("M90 160 L150 90 H250 L310 160 L200 320 Z", Cc.am) + K.P("M90 160 H310 L200 320 Z", Cc.am2), globe: K.globe(200, 200, 140),
            split: K.puzzle(130, 200, 1.1, Cc.am, -10) + K.puzzle(280, 220, 1.1, Cc.w, 10), weak: K.crown(200, 220, 1.2) + K.crack([[200, 120], [180, 190], [214, 240], [196, 300]], Cc.w, 10),
            down: K.S("M60 110 L160 170 L240 230 L330 320", Cc.am, 22) + K.P("M290 330 L346 336 L336 280 Z", Cc.am), ruin: K.Rc(70, 160, 50, 190, 6, Cc.w) + K.Rc(170, 230, 50, 120, 6, Cc.w2) + `<g transform="rotate(32 300 350)">${K.Rc(270, 160, 50, 190, 6, Cc.w3)}</g>` + K.Rc(40, 340, 320, 20, 6, Cc.w3),
          };
          const CH = [["crown", "د واک انحصار", 80, 400, 214.5], ["cash", "مالي سیالي", 544, 400, 216.26], ["gem", "شخصي ګټې", 80, 572, 217.16], ["globe", "بهرنۍ اړیکې", 544, 572, 218.92]];
          const cards = CH.map(([k, txt, x, y, t]) => {
            const cd = mk("div", "ccard", c, { left: x, top: y });
            svg(cd, minis[k], "0 0 400 400");
            mk("div", "", cd, null, txt);
            tl.from(cd, { x: x < 400 ? -120 : 120, opacity: 0, duration: 0.5, ease: EXPO }, t);
            cue(t, "pop_whoosh", -6);
            return cd;
          });
          const H = K.columnHall(500, 860, 0.9);
          const hs = svg(c, `<g class="hb">${H.base}</g>` + H.cols.map((cc) => `<g class="hc">${cc}</g>`).join("") + `<g class="hr">${H.roof}</g><g class="hk">${K.crack([[380, 520], [410, 600], [384, 680], [420, 760]], Cc.am, 10)}${K.crack([[620, 500], [600, 580], [636, 640]], Cc.am, 9)}</g>`, "0 0 1000 900", "stage", { top: 420 });
          tl.from(hs, { y: 80, opacity: 0, duration: 0.7, ease: EXPO }, t0 + 0.3);
          tl.set(hs.querySelector(".hk"), { opacity: 0 }, t0).set(hs.querySelector(".hk"), { opacity: 1 }, 222.4);
          drawStrokes(hs.querySelector(".hk"), 222.45, 0.4);
          tl.to(hs, { x: "+=12", duration: 0.05, yoyo: true, repeat: 7, ease: "none" }, 222.5);
          cue(222.45, "glass_break", -9);
          const capA = caption(c, sc.textA, sc.spanA);
          tl.to([...cards, capA], { opacity: 0, y: -24, duration: 0.35, ease: "power2.in" }, TB);
          hs.querySelectorAll(".hc").forEach((g, i) => tl.to(g, { rotation: [-26, 18, -12, 22, -30][i], y: [90, 120, 80, 110, 70][i], opacity: 0.3, duration: 0.8, ease: "power2.in", transformOrigin: "50% 100%" }, TB + 0.05 + i * 0.06));
          tl.to(hs.querySelector(".hr"), { y: 160, rotation: 8, opacity: 0.35, duration: 0.8, ease: "bounce.out", transformOrigin: "50% 50%" }, TB + 0.1);
          tl.to(hs, { opacity: 0, duration: 0.4 }, TB + 0.9);
          cue(TB, "crumple_quick", -6);
          const keys = ["split", "weak", "down", "ruin"];
          sc.rows.forEach(([txt, t], i) => {
            const r = mk("div", "row", c, { top: 420 + i * 196 });
            mk("div", "no", r, null, FA(i + 1));
            mk("div", "tx2", r, null, txt);
            svg(r, minis[keys[i]], "0 0 400 400");
            tl.from(r, { x: 140, opacity: 0, duration: 0.5, ease: EXPO }, t);
            cue(t, "fast_swoosh", -8);
          });
          const capB = caption(c, sc.textB, sc.spanB);
          tl.fromTo(capB, { opacity: 0 }, { opacity: 1, duration: 0.3 }, TB + 0.3);
          tl.to(c, { opacity: 0, duration: 0.3 }, sc.t1 - 0.3);
        }
        function buildOutro(c, sc) {
          const t0 = sc.t0;
          const disc = (col) => mk("div", "abs", c, { left: 540 - 1200, top: 960 - 1200, width: 2400, height: 2400, borderRadius: "50%", background: col });
          const r1 = disc("#EAA500"), r2 = disc("#ffffff"), r3 = disc("#051449");
          tl.fromTo(r1, { scale: 0 }, { scale: 1, duration: 0.7, ease: "power3.inOut" }, t0 + 0.05);
          tl.fromTo(r2, { scale: 0 }, { scale: 1, duration: 0.7, ease: "power3.inOut" }, t0 + 0.5);
          tl.fromTo(r3, { scale: 0 }, { scale: 1, duration: 0.75, ease: "power3.inOut" }, t0 + 0.95);
          const L = mk("div", "abs", c, { left: 160, top: 800, width: 760, height: 232 });
          const lc = mk("img", "", L, { position: "absolute", left: 0, top: 0, width: 760 }); lc.src = "assets/img/logo-color.png";
          const gr = mk("img", "", L, { position: "absolute", left: 0, top: 0, width: 760, opacity: 0, mixBlendMode: "screen", filter: "hue-rotate(300deg) saturate(3)" }); gr.src = "assets/img/logo-white.png";
          const gb = mk("img", "", L, { position: "absolute", left: 0, top: 0, width: 760, opacity: 0, mixBlendMode: "screen", filter: "hue-rotate(160deg) saturate(3)" }); gb.src = "assets/img/logo-white.png";
          const T = t0 + 1.65;
          tl.fromTo(L, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.6, ease: EXPO }, T);
          tl.fromTo([gr, gb], { opacity: 0 }, { opacity: 0.55, duration: 0.06, ease: "steps(1)", yoyo: true, repeat: 7 }, T + 0.05);
          tl.fromTo(gr, { x: 0 }, { keyframes: { x: [0, -14, 9, -6, 12, 0] }, duration: 0.5, ease: "steps(5)" }, T + 0.05);
          tl.fromTo(gb, { x: 0 }, { keyframes: { x: [0, 12, -10, 7, -12, 0] }, duration: 0.5, ease: "steps(5)" }, T + 0.05);
          tl.fromTo(lc, { clipPath: "inset(0% 0% 0% 0%)" }, { keyframes: { clipPath: ["inset(10% 0% 55% 0%)", "inset(60% 0% 8% 0%)", "inset(30% 0% 40% 0%)", "inset(0% 0% 0% 0%)"] }, duration: 0.45, ease: "steps(4)" }, T + 0.1);
          const soc = mk("div", "", c, { position: "absolute", left: 0, top: 1090, width: 1080, textAlign: "center", fontSize: 44, fontWeight: 700, color: "#a7a9c2", direction: "ltr" }, "@hindukush");
          tl.fromTo(soc, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: EXPO }, T + 0.7);
          tl.to(L, { y: -10, duration: END - T - 1, ease: "sine.out" }, T + 0.8);
          cue(t0 + 0.05, "cine_whoosh", -4); cue(t0 + 0.5, "air_woosh", -8); cue(t0 + 0.95, "fast_whoosh", -6); cue(T, "logo_impact", -3); cue(T + 0.05, "glitch_buzz", -10);
        }

        // ---------- full-screen wipes between scenes (four kinds, rotating) ----------
        function wipe(b, k) {
          const W = document.getElementById("wipes");
          const kind = ["slash", "blinds", "iris", "push"][k % 4];
          const A = b - 0.28, Z = b + 0.02;
          if (kind === "slash") {
            const g = mk("div", "wp", W, { left: 0, top: -200, width: 2300, height: 2400, background: "#051449" });
            mk("div", "wp", g, { left: 0, top: 0, width: 46, height: 2400, background: "#EAA500" });
            mk("div", "wp", g, { right: 0, top: 0, width: 18, height: 2400, background: "#E4E4EA" });
            gsap.set(g, { skewX: -16, x: 2100 });
            tl.to(g, { x: -600, duration: 0.3, ease: "power2.in" }, A).to(g, { x: -3400, duration: 0.32, ease: "power2.out" }, Z);
            cue(A, k % 8 < 4 ? "fast_swoosh" : "cine_whoosh", -5);
          } else if (kind === "blinds") {
            for (let i = 0; i < 8; i++) {
              const s = mk("div", "wp", W, { left: i * 135, top: 0, width: 136, height: 1920, background: i % 3 === 1 ? "#0b2063" : "#051449" });
              if (i === 4) mk("div", "wp", s, { left: 0, top: 0, width: 136, height: 14, background: "#EAA500" });
              tl.fromTo(s, { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.24, ease: "power2.in" }, A + i * 0.012);
              tl.to(s, { scaleY: 0, transformOrigin: "50% 100%", duration: 0.26, ease: "power2.out" }, Z + i * 0.015);
            }
            cue(A, "sweep_small", -4); cue(Z, "tw_soft", -10);
          } else if (kind === "iris") {
            const r = mk("div", "wp", W, { left: 540 - 1250, top: 960 - 1250, width: 2500, height: 2500, borderRadius: "50%", background: "#051449", border: "40px solid #EAA500" });
            tl.fromTo(r, { scale: 0 }, { scale: 1, duration: 0.3, ease: "power2.in" }, A);
            tl.to(r, { opacity: 0, scale: 1.15, duration: 0.3, ease: "power1.out" }, Z);
            cue(A, "air_zoom", -6);
          } else {
            const g = mk("div", "wp", W, { left: 0, top: 0, width: 1080, height: 1920, background: "#051449" });
            mk("div", "wp", g, { left: 0, top: 0, width: 1080, height: 22, background: "#EAA500" });
            tl.fromTo(g, { y: 1940 }, { y: 0, duration: 0.3, ease: "power2.in" }, A);
            tl.to(g, { y: -1960, duration: 0.32, ease: "power2.out" }, Z);
            cue(A, "air_woosh", -5);
          }
        }

        // ---------- background (whole film): dotted world map, slow beams ----------
        (function () {
          const polys = [[[60, 90], [200, 55], [310, 80], [330, 140], [270, 200], [235, 262], [180, 240], [120, 170], [62, 140]], [[240, 270], [300, 280], [332, 330], [300, 420], [270, 462], [252, 400], [232, 320]], [[440, 92], [540, 68], [585, 100], [545, 140], [480, 152], [455, 122]], [[455, 180], [560, 168], [602, 232], [580, 322], [530, 384], [500, 330], [468, 262]], [[560, 70], [800, 58], [905, 110], [882, 182], [800, 222], [742, 262], [682, 232], [620, 192], [582, 142]], [[780, 330], [872, 320], [892, 382], [820, 402], [780, 372]]];
          const inside = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < ((p[j][0] - p[i][0]) * (y - p[i][1])) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; } return c; };
          let d = "";
          for (let y = 40; y < 480; y += 11) for (let x = 20; x < 990; x += 11) if (polys.some((p) => inside(x, y, p))) d += `<circle cx="${x}" cy="${y}" r="3" fill="#8EA4DE"/>`;
          document.getElementById("map").innerHTML = d;
        })();
        tl.fromTo("#map", { x: 0 }, { x: 260, duration: END, ease: "none" }, 0);
        tl.to("#bm1", { x: 560, duration: END / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.to("#bm2", { x: -520, duration: END / 3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
        tl.to("#brand", { opacity: 0, duration: 0.3 }, OUT_T);

        const fontsP = Promise.all([600, 700, 800, 900].map((wt) => document.fonts.load(wt + ' 40px "Quds"', "ښږډ")));
        fontsP.then(() => document.fonts.ready).then(() => {
          D.forEach((sc, i) => {
            const c = document.getElementById("c" + i);
            if (sc.kind === "item") buildItem(c, sc);
            else if (sc.kind === "intro") buildIntro(c, sc);
            else if (sc.kind === "div") buildDiv(c, sc);
            else if (sc.kind === "concl") buildConcl(c, sc);
            else if (sc.kind === "outro") buildOutro(c, sc);
            if (i > 0 && sc.kind !== "outro") wipe(sc.t0, i);
          });
          tl.set({}, {}, END);
          CUES.sort((a, b) => a[0] - b[0]);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          window.__ready = true;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        });
      })();
    </script>
  </body>
