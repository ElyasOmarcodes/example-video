    <style>
      @font-face { font-family: "Quds"; src: url("assets/fonts/quds_bold.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "Quds"; src: url("assets/fonts/quds_extrabold.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Quds"; src: url("assets/fonts/quds_black.ttf") format("truetype"); font-weight: 800; }
      @font-face { font-family: "Quds"; src: url("assets/fonts/quds_extrablack.ttf") format("truetype"); font-weight: 900; }
      :root {
        --bg0: #122126; --bg1: #1a2f34; --ink: #eee7d9; --mut: #9fb5b0; --dim: rgba(238, 231, 217, 0.14);
        --sand: #ddbe8e; --sage: #8cc3b0; --mist: #a6bedd; --hot: #e39a82; --acc: var(--sand);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg0); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Quds", sans-serif; color: var(--ink); }
      .clip { position: absolute; inset: 0; }
      .cam { position: absolute; inset: 0; }
      .abs { position: absolute; }
      /* background */
      #bg { background: radial-gradient(130% 80% at 50% 38%, var(--bg1) 0%, var(--bg0) 70%); }
      .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(60px); opacity: 0.16; }
      #dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(238, 231, 217, 0.09) 1.6px, transparent 1.8px); background-size: 44px 44px; }
      #vig { position: absolute; inset: 0; background: radial-gradient(120% 75% at 50% 45%, transparent 55%, rgba(6, 14, 17, 0.6) 100%); }
      /* brand */
      #logo { position: absolute; left: 60px; top: 66px; height: 62px; }
      #handle { position: absolute; left: 0; right: 0; top: 1838px; text-align: center; font-size: 30px; font-weight: 600; color: var(--mut); opacity: 0.75; direction: ltr; }
      /* chip (section) */
      .chip { position: absolute; right: 60px; top: 70px; height: 58px; padding: 0 26px; border-radius: 29px; border: 2px solid rgba(238, 231, 217, 0.16); background: rgba(238, 231, 217, 0.05); display: flex; align-items: center; gap: 14px; direction: rtl; font-size: 30px; font-weight: 700; color: var(--ink); white-space: nowrap; }
      .chip .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--acc); }
      .chip .cnt { color: var(--acc); font-weight: 800; }
      /* written-only heading: solid tab with number badge */
      .head { position: absolute; left: 60px; right: 60px; top: 236px; height: 150px; display: flex; align-items: center; justify-content: center; gap: 22px; direction: rtl; }
      .head .num { flex: 0 0 auto; width: 118px; height: 118px; border-radius: 50%; border: 5px solid var(--acc); display: flex; align-items: center; justify-content: center; font-size: 54px; font-weight: 900; color: var(--acc); }
      .head .pill { position: relative; flex: 0 1 auto; height: 118px; padding: 0 44px; border-radius: 24px 59px 59px 24px; background: var(--acc); display: flex; align-items: center; white-space: nowrap; font-weight: 900; color: #13232a; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28); }
      .head .pill::after { content: ""; position: absolute; left: 18px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: rgba(19, 35, 42, 0.35); }
      /* medallion */
      .med { position: absolute; left: 160px; top: 490px; width: 760px; height: 760px; }
      .med .ring, .med .orbit, .med .dash, .med .flip { position: absolute; inset: 0; }
      .med .disc { position: absolute; left: 80px; top: 80px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, rgba(238, 231, 217, 0.07), rgba(238, 231, 217, 0.025) 70%); border: 2px solid rgba(238, 231, 217, 0.1); }
      .med .ic { position: absolute; left: 120px; top: 120px; width: 520px; height: 520px; overflow: visible; }
      .med .shake { position: absolute; inset: 0; }
      .med .marker { position: absolute; left: 368px; top: -6px; width: 24px; height: 24px; }
      .ic { overflow: visible; }
      .ic .k, .ic .a, .ic .m, .ic .cr { fill: none; stroke-width: 7px; stroke-linecap: round; stroke-linejoin: round; }
      .ic .k { stroke: var(--ink); }
      .ic .a { stroke: var(--acc); }
      .ic .m { stroke: var(--mut); opacity: 0.75; }
      .ic .cr { stroke: var(--hot); }
      .ic .fa { fill: var(--acc); opacity: 0.2; stroke: none; }
      .ic .fk { fill: var(--ink); opacity: 0.08; stroke: none; }
      .ic .fs { fill: var(--acc); stroke: none; }
      .ic .fc { fill: var(--hot); stroke: none; }
      /* spoken text */
      .desc { position: absolute; left: 70px; right: 70px; top: 1316px; text-align: center; direction: rtl; font-size: 54px; line-height: 1.62; font-weight: 600; color: var(--ink); }
      .w { display: inline-block; }
      .rail { position: absolute; left: 160px; width: 760px; top: 1716px; height: 10px; display: flex; gap: 10px; direction: rtl; }
      .rail i { flex: 1 1 0; height: 10px; border-radius: 5px; background: var(--dim); }
      .rail i.past { background: var(--acc); opacity: 0.45; }
      .rail i.cur { background: var(--acc); flex-grow: 2.4; }
      /* intro / dividers */
      .ttl { position: absolute; left: 60px; right: 60px; text-align: center; direction: rtl; font-weight: 900; line-height: 1.45; color: var(--ink); }
      .ttl .k2 { color: var(--acc); }
      .bignum { position: absolute; left: 0; right: 0; top: 380px; text-align: center; font-size: 980px; line-height: 1; font-weight: 900; color: transparent; -webkit-text-stroke: 4px var(--acc); opacity: 0.16; }
      .art { position: absolute; overflow: visible; }
      .uline { position: absolute; height: 10px; border-radius: 5px; background: var(--acc); }
      /* conclusion */
      .mchip { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(26, 47, 52, 0.92); border: 3px solid var(--acc); }
      .mchip svg { position: absolute; left: 30px; top: 30px; width: 140px; height: 140px; overflow: visible; }
      .row { position: absolute; left: 90px; right: 90px; height: 148px; border-radius: 30px; background: rgba(238, 231, 217, 0.05); border: 2px solid rgba(238, 231, 217, 0.1); direction: rtl; display: flex; align-items: center; gap: 30px; padding: 0 22px; }
      .row .ico { flex: 0 0 auto; width: 108px; height: 108px; border-radius: 50%; background: rgba(140, 195, 176, 0.12); border: 3px solid var(--acc); position: relative; }
      .row .ico svg { position: absolute; left: 14px; top: 14px; width: 74px; height: 74px; overflow: visible; }
      .row .tx { font-size: 50px; font-weight: 800; color: var(--ink); white-space: nowrap; }
      .row .no { margin-right: auto; font-size: 40px; font-weight: 900; color: var(--acc); opacity: 0.7; }
      .lead { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; font-size: 50px; font-weight: 800; color: var(--acc); }
      /* outro */
      .panel { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 45%, #1d3438 0%, #0f1c20 75%); }
      .slogan { position: absolute; left: 40px; right: 40px; top: 1060px; text-align: center; direction: rtl; font-size: 80px; font-weight: 900; color: var(--sand); }
      .hdl { position: absolute; left: 0; right: 0; top: 1205px; text-align: center; font-size: 40px; font-weight: 700; color: var(--mut); direction: ltr; }

                  gsap.set(el, { strokeDashoffset: 1 });
                  tl.to(el, { strokeDashoffset: 0, duration: 0.35, ease: "power1.in" }, T);
                  if (shakeEl) tl.fromTo(shakeEl, { x: -9 }, { x: 9, duration: 0.05, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, T + 0.05).to(shakeEl, { x: 0, duration: 0.05 }, T + 0.36);
                  break;
                case "snap":
                  tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 0.2);
                  tl.to(el, { opacity: 0.15, duration: 0.06, yoyo: true, repeat: 3 }, T);
                  tl.to(el, { opacity: 0, scale: 0.5, transformOrigin: "50% 50%", duration: 0.3 }, T + 0.3);
                  break;
                case "tilt":
                  tl.fromTo(el, { rotation: -g("r", 6), ...org }, { rotation: g("r", 6), duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 0.3, 1.1), ...org }, t0 + 0.3);
                  break;
                case "tilt1":
                  tl.to(el, { rotation: g("r", -12), duration: 1.4, ease: "elastic.out(1, 0.45)", ...org }, T);
                  break;
                case "strike": {
                  const n = Math.max(1, Math.floor((e - s) / 1.0));
                  for (let k = 0; k < n; k++) tl.to(el, { rotation: g("r", -20), duration: 0.16, yoyo: true, repeat: 1, ease: "power2.in", ...org }, s + 0.3 + k * 1.0);
                  break;
                }
                case "blink":
                  tl.to(el, { opacity: 0.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - T, 0.5) | 1 }, T);
                  break;
                case "pulse":
                  tl.to(el, { scale: g("s", 1.08), duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - T - 0.5, 0.7) | 1, transformOrigin: "50% 50%" }, T + 0.5);
                  break;
                case "march":
                  [...el.children].forEach((ch) => {
                    ch.style.strokeDasharray = "12 16";
                    tl.fromTo(ch, { strokeDashoffset: 0, opacity: 0 }, { strokeDashoffset: -6 * (t1 - t0) * 10, opacity: 1, duration: t1 - t0, ease: "none" }, t0);
                  });
                  break;
                case "rain":
                  [...el.children].forEach((ch, i) => tl.fromTo(ch, { y: -14, opacity: 1 }, { y: 50, opacity: 0, duration: 0.8, ease: "power1.in", repeat: reps(t1 - t0 - 0.6, 0.8) }, t0 + 0.5 + i * 0.26));
                  break;
                case "fade":
                  tl.to(el, { opacity: g("o", 0.3), duration: 0.6 }, T);
                  break;
                case "fall":
                  tl.to(el, { y: g("y", 120), rotation: 28, opacity: 0.25, duration: 1.0, ease: "power2.in", transformOrigin: "50% 50%" }, T);
                  break;
                case "droop":
                  tl.to(el, { y: g("y", 0), rotation: g("r", 0), duration: 1.0, ease: "bounce.out", ...org }, T);
                  break;
                case "grow":
                  gsap.set(el, { scaleY: 0, transformOrigin: "50% 100%" });
                  tl.to(el, { scaleY: 1, duration: 0.6, ease: OUT }, t0 + 0.3 + g("t", 0) * 2);
                  break;
                case "tug":
                  tl.fromTo(el, { x: -g("x", 16) }, { x: g("x", 16), duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 0.4, 0.7) }, t0 + 0.4);
                  break;
                case "domino":
                  tl.to(el, { rotation: 62, duration: 0.42, ease: "power2.in", ...org }, T);
                  break;
                case "ripple":
                  gsap.set(el, { opacity: 0 });
                  tl.fromTo(el, { scale: 0.6, opacity: 0.9, transformOrigin: "50% 50%" }, { scale: 4.2, opacity: 0, duration: 1.4, ease: "power1.out", repeat: 1 }, T);
                  break;
                case "meridian": {
                  const rx = +el.getAttribute("rx");
                  tl.to(el, { attr: { rx: rx * 0.1 }, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: reps(t1 - t0 - 1, 1.3) }, t0 + 1);
                  break;
                }
              }
            });
          });
        }

        // ---------- shared builders ----------
        function chip(p, sec, n, N) {
          const c = mk("div", "chip", p);
          mk("i", "dot", c);
          mk("span", "", c, null, SEC[sec]);
          if (n) mk("span", "cnt", c, null, pad(n) + " / " + pad(N));
          return c;
        }
        function heading(p, text, n, t0, big) {
          const h = mk("div", "head", p, big ? { top: 400, height: 170 } : null);
          let num = null;
          if (n) num = mk("div", "num", h, null, pad(n));
          const pill = mk("div", "pill", h, big ? { height: 150, padding: "0 70px", borderRadius: "75px" } : null);
          const sp = mk("span", "", pill, null, text);
          const base = big ? 96 : 76, maxW = n ? 700 : 820;
          const w0 = measure(text, 900, base);
          let fs = Math.min(base, Math.floor((base * maxW) / w0));
          if (fs < 56) {
            fs = 58;
            Object.assign(pill.style, { whiteSpace: "normal", height: "auto", maxWidth: "780px", padding: "14px 40px", lineHeight: "1.25", textAlign: "center", borderRadius: "34px" });
          }
          pill.style.fontSize = fs + "px";
          if (num) tl.fromTo(num, { scale: 0, rotation: -120 }, { scale: 1, rotation: 0, duration: 0.6, ease: BACK }, t0 + 0.02);
          tl.fromTo(pill, { clipPath: "inset(0% 0% 0% 100% round 34px)" }, { clipPath: "inset(0% 0% 0% 0% round 34px)", duration: 0.6, ease: OUT }, t0 + 0.08);
          tl.fromTo(sp, { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: OUT }, t0 + 0.2);
          return h;
        }
        function rail(p, n, N, t0) {
          const r = mk("div", "rail", p);
          for (let i = 1; i <= N; i++) {
            const it = mk("i", i < n ? "past" : i === n ? "cur" : "", r);
            if (i === n) tl.fromTo(it, { scaleX: 0.15, transformOrigin: "100% 50%" }, { scaleX: 1, duration: 0.7, ease: OUT }, t0 + 0.1);
          }
          return r;
        }
        function medallion(p, N, n, t0, t1, iconSvg) {
          const m = mk("div", "med", p);
          const step = 360 / N;
          const ring = mk("div", "ring", m);
          let ticks = "";
          for (let i = 0; i < N; i++) {
            const a = (i * step * Math.PI) / 180, on = i === n - 1;
            const r1 = on ? 334 : 344, r2 = 366;
            ticks += `<line x1="${380 + Math.sin(a) * r1}" y1="${380 - Math.cos(a) * r1}" x2="${380 + Math.sin(a) * r2}" y2="${380 - Math.cos(a) * r2}" stroke="${on ? "var(--acc)" : i < n - 1 ? "rgba(238,231,217,.45)" : "rgba(238,231,217,.18)"}" stroke-width="${on ? 9 : 5}" stroke-linecap="round"/>`;
          }
          ring.innerHTML = `<svg viewBox="0 0 760 760" width="760" height="760"><circle cx="380" cy="380" r="356" fill="none" stroke="rgba(238,231,217,.1)" stroke-width="2"/>${ticks}</svg>`;
          tl.fromTo(ring, { rotation: -(n - 2) * step }, { rotation: -(n - 1) * step, duration: 0.9, ease: IO }, t0);
          const dash = mk("div", "dash", m);
          dash.innerHTML = `<svg viewBox="0 0 760 760" width="760" height="760"><circle cx="380" cy="380" r="318" fill="none" stroke="rgba(238,231,217,.16)" stroke-width="2" stroke-dasharray="4 14"/></svg>`;
          tl.fromTo(dash, { rotation: t0 * 6 }, { rotation: t1 * 6, duration: t1 - t0, ease: "none" }, t0);
          const orb = mk("div", "orbit", m);
          orb.innerHTML = `<svg viewBox="0 0 760 760" width="760" height="760"><circle cx="380" cy="24" r="9" fill="var(--acc)"/><circle cx="380" cy="736" r="5" fill="rgba(238,231,217,.5)"/></svg>`;
          tl.fromTo(orb, { rotation: t0 * 14 }, { rotation: t1 * 14, duration: t1 - t0, ease: "none" }, t0);
          mk("div", "marker", m, null, `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M2 2 H22 L12 18 Z" fill="var(--acc)"/></svg>`);
          const flip = mk("div", "flip", m);
          mk("div", "disc", flip);
          const sh = mk("div", "shake", flip);
          const ic = svg(sh, iconSvg);
          tl.fromTo(flip, { rotationY: 90, transformPerspective: 1400 }, { rotationY: 0, duration: 0.55, ease: OUT }, t0);
          tl.to(flip, { rotationY: -90, duration: 0.28, ease: "power2.in" }, t1 - 0.3);
          return { m, ic, sh };
        }

        // ---------- scene builders ----------
        function buildItem(c, sc, si) {
          c.parentNode.style.setProperty("--acc", ACC[sc.sec]);
          chip(c, sc.sec, sc.n, sc.N);
          const h = heading(c, sc.head, sc.n, sc.t0);
          const md = medallion(c, sc.N, sc.n, sc.t0, sc.t1, ICONS[sc.icon]());
          animIcon(md.ic, sc.t0 + 0.05, sc.s, sc.e, sc.t1, md.sh);
          const d = mk("div", "desc", c);
          speak(wordsInto(d, sc.text), [[sc.s, sc.e]]);
          rail(c, sc.n, sc.N, sc.t0);
          // exit
          tl.to(h, { x: 70, opacity: 0, duration: 0.26, ease: "power2.in" }, sc.t1 - 0.3);
          tl.to(d, { y: -24, opacity: 0, duration: 0.26, ease: "power2.in" }, sc.t1 - 0.3);
        }
        function buildIntro(c, sc) {
          c.parentNode.style.setProperty("--acc", ACC[1]);
          const wrap = mk("div", "shake abs", c, { left: 0, top: 0, width: 1080, height: 1920 });
          const ic = svg(wrap, ICONS.intro(), "art", { left: 190, top: 330, width: 700, height: 700 });
          animIcon(ic, 0.0, 0.1, 4.15, sc.t1, wrap);
          tl.fromTo(ic, { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: OUT }, 0);
          const t = mk("div", "ttl", c, { top: 1170, fontSize: 76 });
          const ws = wordsInto(t, sc.text);
          ws.forEach((w) => { if (/اختلاف|عوامل/.test(w.textContent)) w.classList.add("k2"); });
          speak(ws, [[0.05, 4.1]], 0.16);
          const ul = mk("div", "uline", c, { left: 390, width: 300, top: 1520 });
          tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: OUT }, 3.2);
          tl.to([t, ul], { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, sc.t1 - 0.28);
          tl.to(ic, { scale: 1.25, opacity: 0, duration: 0.28, ease: "power2.in" }, sc.t1 - 0.3);
        }
        function buildDiv(c, sc) {
          c.parentNode.style.setProperty("--acc", ACC[sc.sec]);
          chip(c, sc.sec);
          const bn = mk("div", "bignum", c, null, FA(sc.sec));
          tl.fromTo(bn, { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 0.16, duration: 1.2, ease: OUT }, sc.t0);
          const h = heading(c, sc.head, 0, sc.t0 + 0.05, true);
          const wrap = mk("div", "shake abs", c, { left: 0, top: 0, width: 1080, height: 1920 });
          const ic = svg(wrap, ICONS[sc.icon](), "art", { left: 290, top: 640, width: 500, height: 500 });
          animIcon(ic, sc.t0 + 0.2, sc.s, sc.e, sc.t1, wrap);
          const t = mk("div", "ttl", c, { top: 1240, fontSize: 70 });
          speak(wordsInto(t, sc.text), [[sc.s, sc.e]], 0.16);
          tl.to([h, t, ic, bn], { opacity: 0, scale: 0.92, duration: 0.3, ease: "power2.in" }, sc.t1 - 0.32);
        }
        function buildConcl(c, sc) {
          const t0 = sc.t0;
          c.parentNode.style.setProperty("--acc", ACC[2]);
          heading(c, sc.head, 0, t0, true);
          // hall
          const hallBox = mk("div", "abs", c, { left: 280, top: 600, width: 520, height: 520 });
          const hs = svg(hallBox, "", "art", { left: 0, top: 0, width: 520, height: 520 });
          const cols = [110, 170, 230, 290];
          const prim = ICONS.prim;
          hs.innerHTML = `<g class="hframe">${prim.pillarHall(200, 230, 260, 280)}</g>` + cols.map((x) => `<g class="hcol">${prim.column(x, 180, 352, 32)}</g>`).join("") + `<g class="hcrack">${prim.crackLine([[150, 130], [170, 180], [150, 230], [176, 290]])}${prim.crackLine([[250, 120], [236, 170], [258, 210]])}</g>`;
          animIcon(hs, t0 + 0.2, t0 + 0.3, t0 + 1.4, sc.t1, hallBox);
          const crk = [...hs.querySelectorAll(".hcrack path")];
          crk.forEach((p) => { p.setAttribute("pathLength", "1"); p.style.strokeDasharray = "1"; gsap.set(p, { strokeDashoffset: 1 }); tl.to(p, { strokeDashoffset: 0, duration: 0.35 }, 222.5); });
          tl.fromTo(hallBox, { x: -10 }, { x: 10, duration: 0.05, yoyo: true, repeat: 7, immediateRender: false }, 222.55).to(hallBox, { x: 0, duration: 0.05 }, 222.95);
          // cause chips
          const CH = [["crown", 150, 520, 214.5], ["coins", 730, 520, 216.26], ["diamond", 150, 1000, 217.16], ["globe", 730, 1000, 218.92]];
          const lines = svg(c, "", "art", { left: 0, top: 0, width: 1080, height: 1920 });
          lines.setAttribute("viewBox", "0 0 1080 1920");
          const chipEls = [];
          CH.forEach(([k, x, y, t]) => {
            const ch = mk("div", "mchip", c, { left: x, top: y });
            const s2 = svg(ch, ICONS.mini[k]());
            chipEls.push(ch);
            tl.fromTo(ch, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.55, ease: BACK }, t);
            animIcon(s2, t, t, t + 1, sc.t1, null);
            const cx = x + 100, cy = y + 100, hx = 540, hy = 860;
            const ang = Math.atan2(hy - cy, hx - cx);
            const x1 = cx + Math.cos(ang) * 115, y1 = cy + Math.sin(ang) * 115, x2 = hx - Math.cos(ang) * 200, y2 = hy - Math.sin(ang) * 200;
            lines.insertAdjacentHTML("beforeend", `<g class="arr"><path class="a" d="M${x1} ${y1} L${x2} ${y2}"/><path class="a" d="M${x2 - Math.cos(ang - 0.5) * 24} ${y2 - Math.sin(ang - 0.5) * 24} L${x2} ${y2} L${x2 - Math.cos(ang + 0.5) * 24} ${y2 - Math.sin(ang + 0.5) * 24}"/></g>`);
            lines.lastChild.querySelectorAll("path").forEach((p) => drawStroke(p, t + 0.35, 0.5));
          });
          const ta = mk("div", "desc", c, { top: 1290 });
          speak(wordsInto(ta, sc.textA), sc.spanA);
          // phase B: collapse and result list
          const TB = 223.55;
          tl.to([ta, lines, ...chipEls], { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, TB);
          hs.querySelectorAll(".hcol").forEach((g, i) => tl.to(g, { rotation: [-24, 14, -10, 30][i], y: [60, 90, 70, 50][i], opacity: 0.35, duration: 0.8, ease: "power2.in", transformOrigin: "50% 100%" }, TB + 0.1 + i * 0.07));
          tl.to(hs.querySelector(".hframe"), { y: 70, rotation: 6, opacity: 0.5, duration: 0.8, ease: "bounce.out", transformOrigin: "50% 50%" }, TB + 0.15);
          tl.to(hallBox, { x: 0, y: -205, scale: 0.55, duration: 0.8, ease: IO }, TB + 0.2);
          const lead = mk("div", "lead", c, { top: 892 }, "پایله یې");
          tl.fromTo(lead, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: OUT }, 223.9);
          sc.rows.forEach(([txt, t, k], i) => {
            const r = mk("div", "row", c, { top: 990 + i * 172 });
            const ico = mk("div", "ico", r);
            const s3 = svg(ico, ICONS.mini[k]());
            mk("div", "tx", r, null, txt);
            mk("div", "no", r, null, pad(i + 1));
            tl.fromTo(r, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: OUT }, t);
            animIcon(s3, t + 0.05, t, t + 1, sc.t1, null);
          });
          tl.to(c, { opacity: 0, duration: 0.3 }, sc.t1 - 0.32);
        }
        function buildOutro(c, sc) {
          const t0 = sc.t0;
          c.parentNode.style.setProperty("--acc", ACC[1]);
          const pn = mk("div", "panel", c);
          tl.fromTo(pn, { clipPath: "circle(0% at 50% 45%)" }, { clipPath: "circle(80% at 50% 45%)", duration: 0.9, ease: IO }, t0);
          const ring = svg(c, `<circle class="a" cx="200" cy="200" r="180"/><circle class="m" cx="200" cy="200" r="150" style="stroke-dasharray:3 12"/>`, "art", { left: 40, top: 500, width: 1000, height: 1000 });
          ring.querySelectorAll("circle").forEach((p, i) => { if (!i) drawStroke(p, t0 + 0.3, 1.2); });
          tl.fromTo(ring, { rotation: -60, opacity: 0 }, { rotation: 0, opacity: 0.55, duration: 1.4, ease: OUT }, t0 + 0.2);
          const lg = mk("img", "abs", c, { left: 170, top: 770, width: 740 });
          lg.src = "assets/img/logo-white.png";
          tl.fromTo(lg, { clipPath: "inset(0% 0% 0% 100%)", scale: 1.06 }, { clipPath: "inset(0% 0% 0% 0%)", scale: 1, duration: 1.0, ease: OUT }, t0 + 0.45);
          const sl = mk("div", "slogan", c);
          const ws = wordsInto(sl, sc.text);
          tl.fromTo(ws, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.12, ease: OUT }, t0 + 1.2);
          const hd = mk("div", "hdl", c, null, "@hindukush");
          tl.fromTo(hd, { opacity: 0 }, { opacity: 1, duration: 0.6 }, t0 + 2.0);
          tl.to(lg, { scale: 1.03, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, t0 + 1.6);
        }

        // ---------- background motion (whole film) ----------
        tl.to("#b1", { x: 260, y: 180, duration: END / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
        tl.to("#b2", { x: -300, y: -220, duration: END / 3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
        tl.to("#b3", { x: 360, y: -140, duration: END / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
        tl.fromTo("#logo", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: OUT }, 0.2);
        tl.fromTo("#handle", { opacity: 0 }, { opacity: 0.75, duration: 0.8 }, 0.6);
        tl.to("#brand", { opacity: 0, duration: 0.4 }, 232.85 - 0.4);

        const fontsP = Promise.all([600, 700, 800, 900].map((w) => document.fonts.load(w + ' 40px "Quds"', "ښږډ")));
        fontsP.then(() => document.fonts.ready).then(() => {
          D.forEach((sc, i) => {
            const c = document.getElementById("c" + i);
            if (sc.kind === "item") buildItem(c, sc, i);
            else if (sc.kind === "intro") buildIntro(c, sc);
            else if (sc.kind === "div") buildDiv(c, sc);
            else if (sc.kind === "concl") buildConcl(c, sc);
            else if (sc.kind === "outro") buildOutro(c, sc);
          });
          tl.set({}, {}, END);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        });
      })();
    </script>
  </body>
</html>
