<!doctype html>
<html lang="ps">
<head>
<meta charset="UTF-8" />
<title>Thumbnail</title>
<script src="../lib/kit.js"></script>
<script src="../lib/scenes.js"></script>
<style>
  @font-face { font-family: "Quds"; src: url("../assets/fonts/quds_extrabold.ttf"); font-weight: 700; }
  @font-face { font-family: "Quds"; src: url("../assets/fonts/quds_extrablack.ttf"); font-weight: 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030a26; font-family: "Quds", sans-serif; }
  .tb { position: relative; overflow: hidden; background: radial-gradient(120% 80% at 50% 45%, #0d2470 0%, #061551 42%, #030a26 100%); }
  .map { position: absolute; opacity: 0.18; }
  .logo { position: absolute; }
  .h1 { position: absolute; text-align: center; direction: rtl; color: #e4e4ea; font-weight: 900; line-height: 1.25; }
  .h1 .a { color: #eaa500; }
  .band { position: absolute; background: #eaa500; color: #051449; font-weight: 900; text-align: center; direction: rtl; display: flex; align-items: center; justify-content: center; }
  .chip { position: absolute; direction: rtl; display: flex; justify-content: center; gap: 14px; }
  .chip span { background: rgba(228,228,234,.12); border: 2px solid rgba(228,228,234,.25); color: #e4e4ea; font-weight: 700; border-radius: 14px; padding: 8px 22px; }
  .chip span b { color: #eaa500; }
  .ill { position: absolute; overflow: visible; }
  .edge { position: absolute; background: #eaa500; }
</style>
</head>
<body>
<div id="v" class="tb" style="width:1080px;height:1920px"></div>
<div id="h" class="tb" style="width:1280px;height:720px;margin-top:20px"></div>
<script>
  const polys = [[[60,90],[200,55],[310,80],[330,140],[270,200],[235,262],[180,240],[120,170],[62,140]],[[240,270],[300,280],[332,330],[300,420],[270,462],[252,400],[232,320]],[[440,92],[540,68],[585,100],[545,140],[480,152],[455,122]],[[455,180],[560,168],[602,232],[580,322],[530,384],[500,330],[468,262]],[[560,70],[800,58],[905,110],[882,182],[800,222],[742,262],[682,232],[620,192],[582,142]],[[780,330],[872,320],[892,382],[820,402],[780,372]]];
  const inside = (x, y, p) => { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { if ((p[i][1] > y) !== (p[j][1] > y) && x < ((p[j][0] - p[i][0]) * (y - p[i][1])) / (p[j][1] - p[i][1]) + p[i][0]) c = !c; } return c; };
  let dots = ""; for (let y = 40; y < 480; y += 11) for (let x = 20; x < 990; x += 11) if (polys.some((p) => inside(x, y, p))) dots += `<circle cx="${x}" cy="${y}" r="3" fill="#8EA4DE"/>`;
  function ill(p, css) {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 60 1000 820"); s.setAttribute("class", "ill");
    Object.assign(s.style, css); s.innerHTML = SCENES.intro(); p.appendChild(s);
    // freeze the "split" moment: apply each move action statically
    s.querySelectorAll('[data-act~="move"]').forEach((g) => { const x = +g.dataset.x || 0, r = +g.dataset.r || 0; g.setAttribute("transform", `translate(${x * 1.3} 0) rotate(${r * 1.4} 500 450)`); });
    return s;
  }
  function el(p, cls, css, html) { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, css); if (html) e.innerHTML = html; p.appendChild(e); return e; }
  function map(p, css) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 1000 500"); s.setAttribute("class", "map"); Object.assign(s.style, css); s.innerHTML = dots; p.appendChild(s); }
  function logo(p, css) { const i = document.createElement("img"); i.src = "../assets/img/logo-white.png"; i.className = "logo"; Object.assign(i.style, css); p.appendChild(i); }
  // vertical 1080x1920
  const V = document.getElementById("v");
  map(V, { left: "-360px", top: "560px", width: "1800px", height: "900px" });
  logo(V, { left: "60px", top: "64px", height: "74px" });
  el(V, "h1", { left: "50px", right: "50px", top: "230px", fontSize: "86px" }, "د شر و فساد ډلو ترمنځ");
  el(V, "band", { left: "70px", right: "70px", top: "370px", height: "190px", fontSize: "128px", borderRadius: "26px", boxShadow: "0 24px 60px rgba(0,0,0,.45)" }, "د اختلافاتو عوامل");
  ill(V, { left: "-40px", top: "610px", width: "1160px", height: "950px" });
  el(V, "chip", { left: "0", right: "0", top: "1590px", fontSize: "44px" }, "<span><b>۱۴</b> عوامل</span><span><b>۱۴</b> پایلې</span><span><b>۱۰</b> پېښې</span>");
  el(V, "edge", { left: "440px", top: "1748px", width: "200px", height: "8px", borderRadius: "4px" });
  el(V, "h1", { left: "0", right: "0", top: "1780px", fontSize: "38px", color: "#9aa3c7", direction: "ltr", fontWeight: "700" }, "@hindukush");
  // horizontal 1280x720
  const H = document.getElementById("h");
  map(H, { left: "-200px", top: "120px", width: "1400px", height: "700px" });
  ill(H, { left: "-40px", top: "60px", width: "700px", height: "620px" });
  logo(H, { right: "60px", top: "46px", height: "54px" });
  el(H, "h1", { right: "50px", width: "600px", top: "150px", fontSize: "62px" }, "د شر و فساد ډلو ترمنځ");
  el(H, "band", { right: "50px", width: "600px", top: "250px", height: "140px", fontSize: "92px", borderRadius: "22px", boxShadow: "0 20px 50px rgba(0,0,0,.45)" }, "د اختلافاتو عوامل");
  el(H, "chip", { right: "50px", width: "600px", top: "440px", fontSize: "32px" }, "<span><b>۱۴</b> عوامل</span><span><b>۱۴</b> پایلې</span><span><b>۱۰</b> پېښې</span>");
  el(H, "h1", { right: "50px", width: "600px", top: "600px", fontSize: "30px", color: "#9aa3c7", direction: "ltr", fontWeight: "700" }, "@hindukush");
  document.fonts.ready.then(() => (window.__ready = true));
</script>
</body>
</html>
