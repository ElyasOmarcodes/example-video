# Renders a Nahzat episode in parallel: the timeline is split into N frame-exact parts, each part
# runs on its own runner (headless Chromium + SwiftShader), then one job joins them and adds the mix.
name: nahzat-render
on:
  workflow_dispatch:
    inputs:
      project: {description: 'project folder', default: 'nahzat-ur'}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math
          tl = json.load(open('${{ inputs.project }}/data/timeline.json'))
          n = math.ceil(tl['duration'] * tl['fps']); P = 8
          parts = [{'i': i, 'from': round((i * n // P) / tl['fps'], 4), 'to': round(((i + 1) * n // P) / tl['fps'], 4)} for i in range(P)]
          print('parts=' + json.dumps(parts))
          PY
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    defaults: {run: {working-directory: '${{ inputs.project }}'}}
    env: {NAHZAT_MODULES: '${{ github.workspace }}/${{ inputs.project }}/node_modules'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: bash tools/clips.sh && cp data/timeline.json web/assets/timeline.json && node tools/build.mjs
      - run: |
          python3 -m http.server 8770 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          sleep 2
          node tools/capture.mjs --from ${{ matrix.part.from }} --to ${{ matrix.part.to }} --out renders/parts/p${{ matrix.part.i }}.mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'part-${{ matrix.part.i }}', path: '${{ inputs.project }}/renders/parts/p${{ matrix.part.i }}.mp4', retention-days: 3}
  assemble:
    needs: render
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: '${{ inputs.project }}'}}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install numpy
      - uses: actions/download-artifact@v4
        with: {path: '${{ inputs.project }}/renders/parts', pattern: 'part-*', merge-multiple: true}
      - run: |
          python3 tools/sound.py
          ls renders/parts/p*.mp4 | sort -V | sed "s|renders/parts/|file '|; s|$|'|" > renders/parts/list.txt
          ffmpeg -v error -y -f concat -safe 0 -i renders/parts/list.txt -c copy renders/parts/silent.mp4
          ffmpeg -v error -y -i renders/parts/silent.mp4 -i audio/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -ar 48000 -shortest -movflags +faststart renders/final.mp4
      - uses: actions/upload-artifact@v4
        with: {name: 'video', path: '${{ inputs.project }}/renders/final.mp4', retention-days: 14}
