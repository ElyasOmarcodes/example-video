# Renders the Hindukush explainer in ONE job and encodes the film ONCE (no stitched parts in the output).
# A per-scene cache is kept in the `hindukush-cache` release: every scene is fingerprinted from sampled
# frames, so after a small edit only the changed scenes are drawn again; the rest is reused.
# Start: Actions → hindukush-render → Run workflow, or push a change to hindukush/render.request.
# render.request may contain a line `force: all` or `force: P05,P12` to redraw scenes regardless of the cache.
name: hindukush-render
on:
  workflow_dispatch:
  push:
    paths: ['hindukush/render.request']
permissions:
  contents: write
concurrency:
  group: hindukush-render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: hindukush
    env:
      HK_MODULES: ${{ github.workspace }}/hindukush/node_modules
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install numpy
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: cp data/timeline.json web/assets/timeline.json && node tools/build.mjs
      - name: fetch the scene cache
        run: |
          mkdir -p renders/cache
          gh release download hindukush-cache -D renders/cache -p 'seg_*' -p 'manifest.json' 2>/dev/null || echo "no cache yet — full render"
          ls renders/cache | head -50
      - name: render (changed scenes only)
        run: |
          python3 -m http.server 8771 --bind 127.0.0.1 --directory web >/dev/null 2>&1 &
          sleep 2
          FORCE=$(sed -n 's/^force:[[:space:]]*//p' render.request | head -1)
          node tools/render.mjs --cache renders/cache --fps 60 --workers 3 ${FORCE:+--force $FORCE}
          node tools/cues.mjs
      - name: save the scene cache
        if: always()
        run: |
          gh release view hindukush-cache >/dev/null 2>&1 || gh release create hindukush-cache --target "$GITHUB_SHA" --title "Hindukush render cache" --notes "Per-scene segments reused by the hindukush-render workflow." --prerelease
          files=$(sed 's|^|renders/cache/|' renders/cache/rendered.txt | grep -v '/$' || true)
          if [ -n "$files" ]; then gh release upload hindukush-cache $files --clobber; fi
          gh release upload hindukush-cache renders/cache/manifest.json --clobber
      - name: mix and encode once
        run: |
          python3 tools/sound.py
          bash tools/assemble.sh renders/cache renders/hindukush.mp4
          ffmpeg -v error -y -i renders/hindukush.mp4 -c:v libx264 -preset slow -b:v 4M -maxrate 5M -bufsize 9M -pix_fmt yuv420p -c:a aac -b:a 160k -movflags +faststart renders/hindukush-share.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: hindukush/renders/hindukush*.mp4
          retention-days: 14
      - name: publish as a release
        run: |
          tag="hindukush-render-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" renders/hindukush.mp4 renders/hindukush-share.mp4 --target "$GITHUB_SHA" --title "Hindukush render #${GITHUB_RUN_NUMBER}" --notes "Rendered in one job by the hindukush-render workflow from ${GITHUB_SHA}." --prerelease
