      .gradc { background: linear-gradient(180deg, #e9fbff 10%, #6fd8e6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  <body>

    <script>
      (function () {
        // ---------- utilities ----------
        const tl = gsap.timeline({ paused: true });
        const EO = "power3.out", EI = "power2.in", IO = "power2.inOut", SO = "sine.inOut";
        const $ = (id) => document.getElementById(id);
        function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function mk(tag, cls, parent, css, html) {
          const e = document.createElement(tag);
          if (cls) e.className = cls;
          if (css) for (const k in css) e.style[k] = typeof css[k] === "number" && !/opacity|zIndex|fontWeight|lineHeight/.test(k) ? css[k] + "px" : css[k];
          if (html != null) e.innerHTML = html;
          parent.appendChild(e);
          return e;
        }
        function box(parent, x, y, w, h, cls, html, css) { return mk("div", "abs " + (cls || ""), parent, Object.assign({ left: x, top: y, width: w, height: h }, css || {}), html); }
        function ico(name, size, color, extra) {
          const i = window.ICONS[name];
          return `<svg class="ico" width="${size}" height="${size}" viewBox="${i.vb}" fill="${color || "#e6edf3"}" style="${extra || ""}">${i.p}</svg>`;
        }
        // Arabic/English line split into word spans (never split letters: Arabic shaping stays intact)
        function line(parent, text, top, size, cls, opt) {
          opt = opt || {};
          const gm = (cls || "").match(/\bgrad[cv]?\b/);
          if (gm) { cls = cls.replace(gm[0], ""); opt.wcls = ((opt.wcls || "") + " " + gm[0]).trim(); }
          const d = mk("div", "tline " + (cls || ""), parent, Object.assign({ top: top, fontSize: size, lineHeight: opt.lh || 1.55, fontWeight: opt.fw || 700 }, opt.css || {}));
          const parts = text.split(" ");
          const ws = parts.map((p, i) => {
            const s = mk("span", "w " + (opt.wcls || ""), d, null, p);
            if (i < parts.length - 1) d.appendChild(document.createTextNode(" "));
            return s;
          });
          return { el: d, ws: ws };
        }
        function svgLayer(parent) {
          const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          s.setAttribute("class", "lines abs"); s.setAttribute("viewBox", "0 0 1080 1920");
          parent.appendChild(s); return s;
        }
        function path(svg, d, stroke, width, extra) {
          const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
          p.setAttribute("d", d); p.setAttribute("stroke", stroke); p.setAttribute("stroke-width", width);
          p.setAttribute("stroke-linecap", "round"); p.setAttribute("pathLength", "1");
          p.setAttribute("stroke-dasharray", "1"); p.setAttribute("stroke-dashoffset", "1");
          if (extra) for (const k in extra) p.setAttribute(k, extra[k]);
          svg.appendChild(p); return p;
        }
        // ---------- animation vocabulary ----------
        function inUp(t, target, d, dy, blur) { tl.fromTo(target, { opacity: 0, y: dy == null ? 40 : dy, filter: `blur(${blur == null ? 12 : blur}px)` }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d || 0.9, ease: EO }, t); }
        function inScale(t, target, d, s0) { tl.fromTo(target, { opacity: 0, scale: s0 || 0.82, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: d || 0.8, ease: "back.out(1.4)" }, t); }
        function pop(t, target, d) { tl.fromTo(target, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: d || 0.55, ease: "back.out(1.8)" }, t); }
        function out(t, target, d, dy, blur) { tl.to(target, { opacity: 0, y: dy == null ? -24 : dy, filter: `blur(${blur == null ? 10 : blur}px)`, duration: d || 0.55, ease: EI }, t); }
        function fade(t, target, to, d, ease) { tl.to(target, { opacity: to, duration: d || 0.5, ease: ease || SO }, t); }
        function words(t0, ws, times, d) { ws.forEach((w, i) => { const t = times && times[i] != null ? times[i] : t0 + i * 0.14; tl.fromTo(w, { opacity: 0, y: 34, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d || 0.75, ease: EO }, t); }); }
        // RTL mask reveal: the visible area grows from the right edge toward the left
        function maskRTL(t, target, d) { tl.fromTo(target, { clipPath: "inset(-30% -4% -30% 100%)" }, { clipPath: "inset(-30% -4% -30% 0%)", duration: d || 1.0, ease: "power3.inOut" }, t); }
        function maskLTR(t, target, d) { tl.fromTo(target, { clipPath: "inset(-30% 100% -30% -4%)" }, { clipPath: "inset(-30% 0% -30% -4%)", duration: d || 1.0, ease: "power3.inOut" }, t); }
        function draw(t, p, d, ease) { tl.fromTo(p, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.8, ease: ease || IO }, t); }
        function camIn(t, cam, d) { tl.fromTo(cam, { opacity: 0, scale: 1.06, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: d || 0.8, ease: EO }, t); }
        function camOut(t, cam, d, s) { tl.to(cam, { opacity: 0, scale: s || 0.94, filter: "blur(14px)", duration: d || 0.7, ease: EI }, t); }
        function drift(t, target, d, props) { tl.to(target, Object.assign({ duration: d, ease: "none" }, props), t); }
        function glowTo(t, d, map) { for (const k in map) tl.to("#" + k, Object.assign({ duration: d, ease: SO }, map[k]), t); }
        function shimmer(t, parent, x, y, w, h) {
          const s = box(parent, x, y, w, h, "", "", { overflow: "hidden", borderRadius: 24, pointerEvents: "none" });
          const b = box(s, -260, -40, 200, h + 80, "", "", { background: "linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0) 100%)" });
          tl.fromTo(b, { x: 0, rotation: 12 }, { x: w + 520, rotation: 12, duration: 1.1, ease: "power2.inOut" }, t);
          return s;
        }
        // chips are anchored at their centre x via xPercent (no width measurement before fonts load)
        function chip(parent, cx, y, html, cls, css) {
          const c = mk("div", "chip " + (cls || ""), parent, Object.assign({ top: y, left: cx }, css || {}), html);
          gsap.set(c, { xPercent: -50 });
          return c;
        }
        function centerChips() {}
        function avatar(parent, cx, cy, size, letter, c1, c2) {
          return mk("div", "avatar", parent, { left: cx - size / 2, top: cy - size / 2, width: size, height: size, fontSize: Math.round(size * 0.44), background: `linear-gradient(140deg, ${c1}, ${c2})` }, letter);
        }
        const AV = [["س", "#1f5fc4", "#16707a"], ["ع", "#6e40c9", "#1f5fc4"], ["ل", "#146c72", "#1d7a33"], ["ي", "#8a5a02", "#b04a17"], ["م", "#a83f7a", "#6e40c9"]];

        // ---------- shared environment ----------
        (function buildBG() {
          const R = rng(7);
          const snippets = [
            "git commit -m \"init\"", "git checkout -b feature/ui", "git push origin main", "const app = createApp();", "def deploy(env):", "<main class=\"app\">",
            "git merge feature/search", "export default router;", "if (user) render(view);", "import { repo } from \"./git\"", "git log --oneline", "npm run build",
            "for f in files:", "return response.json()", "git status", "jobs:\n  build:", "fetch('/api/issues')", "class Repo:", "git pull --rebase", "✓ tests passed",
            "pull_request: [main]", "README.md", "src/components/", "git diff HEAD~1", "async function sync()", "on: push", "runs-on: ubuntu-latest", "git branch -a",
          ];
          const layers = [
            ["fragFar", 34, 18, 0.10, 2.4, -240],
            ["fragMid", 22, 22, 0.16, 1.0, -420],
            ["fragNear", 9, 30, 0.13, 3.2, -700],
          ];
          layers.forEach(([id, n, fs, op, blur, dy], li) => {
            const L = $(id);
            for (let i = 0; i < n; i++) {
              const txt = snippets[Math.floor(R() * snippets.length)];
              const f = mk("div", "frag", L, { left: Math.round(R() * 1000 - 120), top: Math.round(R() * 2650 - 80), fontSize: fs, opacity: op * (0.6 + R() * 0.6), color: ["#79c0ff", "#a5d6ff", "#d2a8ff", "#7ee2e8", "#c9d1d9"][Math.floor(R() * 5)], filter: `blur(${blur}px)` }, txt);
              f.setAttribute("data-layout-ignore", "");
            }
            drift(0, L, 162.9, { y: dy });
          });
          const D = $("dots");
          for (let i = 0; i < 54; i++) {
            const s = 2 + Math.round(R() * 4);
            const d = mk("div", "dot", D, { left: Math.round(R() * 1080), top: Math.round(R() * 2200), width: s, height: s, opacity: 0.15 + R() * 0.45, boxShadow: `0 0 ${6 + s * 2}px rgba(150,200,255,0.8)` });
            drift(0, d, 162.9, { y: -(160 + R() * 520), x: (R() - 0.5) * 120 });
          }
          tl.fromTo("#gridB", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 1440px", duration: 162.9, ease: "none" }, 0);
          tl.fromTo("#gridT", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px -960px", duration: 162.9, ease: "none" }, 0);
          tl.fromTo("#bg", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: SO }, 0);
          // glow choreography per chapter (restrained palette)
          glowTo(0, 6, { glowBlue: { x: 120, y: 160 }, glowViolet: { x: -80, y: 120 }, glowCyan: { x: 60, y: -120 } });
          glowTo(12.6, 2.5, { glowBlue: { x: 330, y: 260, opacity: 1.2 }, glowViolet: { opacity: 0.6 } });
          glowTo(25.0, 4, { glowBlue: { x: 0, y: 600 }, glowViolet: { x: 220, y: -60, opacity: 1 }, glowCyan: { x: -200, y: -300 } });
          glowTo(41.2, 1.2, { glowViolet: { opacity: 0.4 } });
          glowTo(51.4, 2, { glowGreen: { opacity: 0.8, x: 300, y: 240 }, glowViolet: { opacity: 0.9 } });
          glowTo(59.7, 3, { glowGreen: { opacity: 0 }, glowBlue: { x: 260, y: 160 }, glowCyan: { x: 200, y: -500 } });
          glowTo(77.9, 4, { glowViolet: { x: -200, y: 500 }, glowCyan: { x: 360, y: -200 } });
          glowTo(90.8, 3, { glowGreen: { opacity: 0.6, x: 380, y: 520 }, glowBlue: { x: 60, y: 0 } });
          glowTo(98.9, 3, { glowGreen: { opacity: 0 }, glowViolet: { x: 300, y: 300 } });
          glowTo(108.0, 3, { glowCyan: { x: 120, y: -420, opacity: 1.2 }, glowBlue: { x: 330, y: 700 } });
          glowTo(120.2, 4, { glowBlue: { x: 330, y: 380, opacity: 1.3 }, glowViolet: { x: 0, y: 700 }, glowCyan: { x: 400, y: -700 } });
          glowTo(136.4, 4, { glowViolet: { x: 210, y: 200, opacity: 1.1 }, glowCyan: { x: 0, y: -260 } });
          glowTo(149.0, 4, { glowBlue: { x: 330, y: 330, opacity: 1.4 }, glowCyan: { x: 330, y: -300, opacity: 1 } });
        })();

        // =====================================================================
        // A — 0.0 → 25.7  The question, GitHub reveal, the GitHub environment
        // =====================================================================
        (function sceneA() {
          const cam = $("camA");
          const world = box(cam, 0, 0, 1080, 1920);
          tl.fromTo(world, { scale: 1.12 }, { scale: 1.0, duration: 12.6, ease: "power1.out" }, 0); // slow camera push
          const svg = svgLayer(world);
          // floating project pieces in depth
          const pieces = [
            ["file", "index.html", 110, 560, 1.0], ["file", "main.py", 760, 500, 0.92], ["folder", "src/", 210, 860, 1.05],
            ["code", "", 640, 760, 1.0], ["folder", "assets/", 720, 1120, 0.95], ["code2", "", 260, 1200, 0.92],
            ["file", "style.css", 80, 1500, 0.85], ["file", "README.md", 720, 1560, 1.0], ["file", "data.json", 410, 1720, 0.8],
          ];
          const nodes = [];
          pieces.forEach(([kind, name, x, y, s], i) => {
            let el;
            if (kind === "file" || kind === "folder") {
              el = box(world, x, y, 250, 86, "glass row", `<div style="display:flex;align-items:center;gap:16px;padding:0 22px;width:100%">${ico(kind === "folder" ? "folder" : "fileCode", 34, kind === "folder" ? "#79c0ff" : "#a5d6ff")}<span class="mono" style="font-size:26px;color:#e6edf3">${name}</span></div>`, { borderRadius: 20 });
            } else {

        // J — 136.4 → 149.7  Not just a code host — an integrated environment
        // =====================================================================
        (function sceneJ() {
          const cam = $("camJ");
          tl.fromTo(cam, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: SO }, 136.5);
          const CX = 540, CY = 1080;
          const svg = svgLayer(cam);
          const center = box(cam, CX - 120, CY - 120, 240, 240, "glass", ico("mark", 130, "#fff"), { borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 0 120px rgba(121,192,255,0.45), 0 40px 90px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3)" });
          inScale(136.6, center, 1.0, 0.3);
          const orbit = box(cam, CX - 420, CY - 180, 840, 360, "", "", { borderRadius: "50%", border: "2px solid rgba(121,192,255,0.25)" });
          tl.fromTo(orbit, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: EO }, 137.0);
          const IC = [["repo", "#cfe3ff", ""], ["branch", "#7ee2e8", ""], ["commit", "#79c0ff", ""], ["people", "#d2a8ff", "تَعَاوُنٌ"], ["pr", "#3fb950", ""], ["play", "#79c0ff", "بِنَاءٌ"], ["issue", "#a371f7", "إِدَارَةٌ"]];

            if (lab) box(e, -40, 128, 200, 50, "row ar", `<span style="font-size:30px;font-weight:700;color:${col};width:100%;text-align:center">${lab}</span>`);
            return e;
          });
          const lines = els.map(() => { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("stroke", "rgba(121,192,255,0.5)"); l.setAttribute("stroke-width", "2.5"); l.style.opacity = 0; svg.appendChild(l); return l; });
          const S = { a: 0, k: 0 };
          const place = () => {
            els.forEach((e, i) => {
              const th = S.a + (i / els.length) * Math.PI * 2;
              const r = 420 * (0.25 + 0.75 * S.k), x = CX + Math.cos(th) * r, y = CY + Math.sin(th) * 180 * (0.25 + 0.75 * S.k) + (1 - S.k) * (i % 2 ? -900 : 900);
              const depth = (Math.sin(th) + 1) / 2;
              const sc = 0.78 + depth * 0.4;
              e.style.left = x - 60 + "px"; e.style.top = y - 60 + "px"; e.style.transform = `scale(${sc})`; e.style.zIndex = depth > 0.5 ? 3 : 1;
              lines[i].setAttribute("x1", CX); lines[i].setAttribute("y1", CY); lines[i].setAttribute("x2", x); lines[i].setAttribute("y2", y);
            });
            center.style.zIndex = 2;
          };
          tl.fromTo(S, { a: 0 }, { a: Math.PI * 0.9, duration: 13.3, ease: "none", onUpdate: place, immediateRender: false }, 136.4);
          tl.fromTo(S, { k: 0 }, { k: 1, duration: 1.8, ease: "power3.out", onUpdate: place, immediateRender: false }, 136.6);
          place();
          els.forEach((e, i) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.5 }, 136.6 + i * 0.12));
          // statement 1 (word-synced)
          const s1a = line(cam, "غِتْهَبْ لَيْسَ مُجَرَّدَ", 190, 66, "ar");
          const s1b = line(cam, "مَوْقِعٍ لِحِفْظِ الْأَكْوَادِ", 300, 66, "ar", { css: { color: "#cfe3ff" } });
          words(138.6, s1a.ws, [138.6, 139.9, 140.2]);
          words(140.8, s1b.ws, [140.8, 141.4, 141.8]);
          tl.to(s1a.ws[1], { color: "#f0883e", duration: 0.3 }, 139.9);
          out(142.7, [s1a.el, s1b.el], 0.5, -30);
          // statement 2
          const s2a = line(cam, "بِيئَةٌ مُتَكَامِلَةٌ", 170, 96, "ar grad");
          const s2b = line(cam, "لِبِنَاءِ الْبَرْمَجِيَّاتِ وَالتَّعَاوُنِ", 330, 52, "ar", { fw: 500, css: { color: "#cfe3ff" } });
          words(143.3, s2a.ws, [143.4, 143.9]);
          words(144.7, s2b.ws, [144.7, 145.4, 146.3]);
          // integration: spokes connect at "متكاملة"
          lines.forEach((l, i) => tl.to(l, { opacity: 1, duration: 0.5 }, 143.9 + i * 0.06));
          tl.to(orbit, { borderColor: "rgba(121,192,255,0.7)", boxShadow: "0 0 60px rgba(121,192,255,0.35)", duration: 0.6 }, 143.9);
          const hi = (t, i, col) => tl.to(els[i], { boxShadow: `0 0 60px ${col}aa, 0 30px 60px rgba(0,0,0,0.5)`, borderColor: col, duration: 0.5, ease: SO }, t);
          hi(144.7, 5, "#79c0ff"); hi(144.7, 0, "#cfe3ff"); hi(146.3, 3, "#d2a8ff"); hi(147.4, 6, "#a371f7");
          tl.to(center, { boxShadow: "0 0 200px rgba(121,192,255,0.75), 0 40px 90px rgba(0,0,0,0.6)", duration: 0.8, ease: SO, yoyo: true, repeat: 1 }, 143.9);
          // push into the center → next chapter
          tl.to(cam, { scale: 2.4, opacity: 0, filter: "blur(10px)", duration: 1.0, ease: "power3.in", transformOrigin: "50% 56%" }, 148.8);
        })();

        // =====================================================================
        // K — 149.0 → 162.9  Learn Git + GitHub — the closing
        // =====================================================================
        (function sceneK() {
          const cam = $("camK");
          tl.fromTo(cam, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 1.4, ease: EO }, 149.1);
          // light tunnel of code streaks (entering the world of programming)
          const R = rng(99);
          const tun = box(cam, 0, 0, 1080, 1920);
          for (let i = 0; i < 46; i++) {
            const a = R() * Math.PI * 2, len = 60 + R() * 160;

            const d0 = 40 + R() * 200, d1 = 900 + R() * 400, t0 = 149.2 + R() * 3, dur = 2.2 + R() * 1.6;

          const world = line(cam, "عَالَمُ الْبَرْمَجَةِ", 560, 74, "ar", { css: { color: "#e6edf3" } });

          const pro = line(cam, "بِاحْتِرَافِيَّةٍ", 690, 46, "ar", { fw: 300, css: { color: "#8b949e" } });
          inUp(153.3, pro.el, 0.7, 14);
          out(154.4, [world.el, pro.el], 0.5, -40);
          // Git + GitHub lockup at 155.4 / 155.9

          const gi = mk("div", "", icons, { width: 120, height: 120, borderRadius: 28, background: "linear-gradient(140deg,#f05033,#d2453a)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 0 60px rgba(240,80,51,0.5)" }, `<div style="transform:rotate(-45deg)">${ico("branch", 64, "#fff")}</div>`);
          const hi = mk("div", "", icons, { width: 150, height: 150, display: "flex", alignItems: "center", justifyContent: "center" }, ico("mark", 150, "#fff", "filter: drop-shadow(0 0 30px rgba(121,192,255,0.7))"));
          tl.fromTo(gi, { opacity: 0, scale: 0.3, rotation: -45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.8, ease: "back.out(1.6)" }, 155.3);
          tl.fromTo(hi, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.6)" }, 155.8);
          const lock = mk("div", "abs row en", cam, { left: 0, top: 830, width: 1080, height: 170, justifyContent: "center", gap: "26px", fontSize: 136, fontWeight: 800, letterSpacing: "-3px" }, "");
          const lG = mk("span", "grad", lock, null, "Git");
          const lP = mk("span", "", lock, { color: "#79c0ff", fontWeight: 600 }, "+");
          const lH = mk("span", "grad", lock, null, "GitHub");
          tl.fromTo(lG, { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: EO }, 155.4);
          tl.fromTo(lP, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 155.7);
          tl.fromTo(lH, { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: EO }, 155.9);
          const sk = line(cam, "مِنْ أَهَمِّ مَهَارَاتِ الْمُبَرْمِجِ", 1080, 70, "ar gradc");
          words(157.5, sk.ws, [157.5, 157.8, 158.2, 158.7]);
          const ul = box(cam, 290, 1230, 500, 4, "", "", { background: "linear-gradient(90deg, rgba(126,226,232,0), #7ee2e8, rgba(126,226,232,0))", borderRadius: 2 });
          tl.fromTo(ul, { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 1.0, ease: IO }, 158.6);
          tl.to(lock, { scale: 1.03, duration: 0.7, ease: SO, yoyo: true, repeat: 1 }, 159.3);
          tl.to(hi, { filter: "drop-shadow(0 0 40px rgba(165,214,255,0.9))", duration: 0.7, ease: SO, yoyo: true, repeat: 1 }, 159.3);
          // orbiting ring behind the lockup
          const ring = box(cam, 140, 520, 800, 800, "", "", { borderRadius: "50%", border: "2px solid rgba(121,192,255,0.22)", boxShadow: "0 0 80px rgba(47,129,247,0.18), inset 0 0 80px rgba(47,129,247,0.12)" });
          ring.style.zIndex = -1;
          tl.fromTo(ring, { opacity: 0, scale: 0.5, rotation: 0 }, { opacity: 1, scale: 1, rotation: 60, duration: 12, ease: SO }, 149.4);
          // after the final spoken word (~161.4): settle, bloom, gentle push, fade
          const bloom = box(cam, -60, 300, 1200, 1200, "", "", { borderRadius: "50%", background: "radial-gradient(circle, rgba(165,214,255,0.32) 0%, rgba(121,192,255,0.08) 40%, rgba(0,0,0,0) 70%)" });
          tl.fromTo(bloom, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1.4, ease: SO }, 161.3);
          tl.to(cam, { scale: 1.05, duration: 1.6, ease: "power1.inOut" }, 161.3);
          tl.to("#fade", { opacity: 1, duration: 0.85, ease: "power1.in" }, 162.05);
        })();

        document.fonts.ready.then(() => {
          window.__timelines["main"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        });
      })();
