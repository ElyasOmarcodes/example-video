<!doctype html>
<html lang="ps">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="lib/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Plex"; src: url("assets/fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Plex"; src: url("assets/fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Plex"; src: url("assets/fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Plex", sans-serif; }
      #src { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.45) 55%, rgba(0,0,0,0.6) 100%); pointer-events: none; }
      .cap { position: absolute; left: 50px; top: 1545px; width: 980px; text-align: center; direction: rtl; }
      .pill {
        display: inline-block; position: relative; max-width: 980px; padding: 22px 40px 26px; border-radius: 34px;
        background: linear-gradient(160deg, rgba(18,18,24,0.72), rgba(10,10,14,0.62));
        box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 1.5px rgba(255,255,255,0.08);
        font-size: 54px; line-height: 1.6; font-weight: 600; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      }
      .w { display: inline-block; white-space: pre; }
      .hl { color: #f6c75e; font-weight: 700; text-shadow: 0 0 22px rgba(246,199,94,0.45), 0 2px 10px rgba(0,0,0,0.5); }
      .bar { position: absolute; left: 40px; right: 40px; bottom: 12px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(246,199,94,0), #f6c75e, rgba(246,199,94,0)); transform-origin: 100% 50%; }
      .lab { position: absolute; direction: rtl; font-family: "Plex", sans-serif; }
      .tcard { background: #ffffff; color: #111; font-weight: 700; font-size: 58px; line-height: 1.38; text-align: right; padding: 20px 30px 22px; box-shadow: 0 14px 40px rgba(0,0,0,0.35); }
      .tcard .ln { display: block; white-space: nowrap; }
      .tcard .acc { color: #b0221c; }
      .nm { background: #ffffff; color: #111; font-weight: 700; font-size: 58px; line-height: 1.45; text-align: right; padding: 4px 26px 8px; }
      .role { background: #0e0e10; min-height: 184px; margin-top: -8px; padding-top: 20px; color: #fff; font-weight: 500; font-size: 42px; line-height: 1.55; text-align: right; padding: 12px 26px 16px; }
      .loc { display: flex; align-items: center; gap: 12px; padding: 8px 22px 10px; border-radius: 30px; background: rgba(10,10,12,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #fff; font-weight: 600; font-size: 38px; }
      .sig { display: flex; align-items: center; gap: 14px; padding: 10px 26px 12px; border-radius: 34px; background: rgba(12,12,16,0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1.5px rgba(246,199,94,0.45), 0 10px 30px rgba(0,0,0,0.35); color: #fff; font-weight: 700; font-size: 38px; }
      .sig .dot { width: 12px; height: 12px; border-radius: 50%; background: #f6c75e; box-shadow: 0 0 14px #f6c75e; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="23.08">
      <video id="src" class="clip" src="assets/video/source.mp4" data-start="0" data-duration="23.08" data-track-index="0" data-has-audio="true" data-volume="1" playsinline></video>
      <div id="shade"></div>
      <!-- Pashto replacements for the burned-in Arabic labels (positions/timing measured from the source) -->
      <div id="title" class="lab tcard" style="right:155px; top:1072px; width:680px; height:336px;"><span class="ln">د سنوار او <span class="acc">ضیف</span> ترمنځ</span><span class="ln">نادره ټیلیفوني اړیکه</span><span class="ln">له «سیف القدس» وروسته</span></div>
      <div id="nameL" class="lab" style="right:150px; top:950px; width:704px;"><div class="nm" id="nm" style="display:block; float:right; width:470px; height:146px; padding-top:42px;">یحیی سنوار</div><div style="clear:both"></div><div class="role" id="role">د حماس غورځنګ د سیاسي دفتر<br>پخوانی مشر</div></div>
      <div id="loc" class="lab loc" style="right:160px; top:1456px; width:300px;"><svg width="30" height="38" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0zm0 16.3a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z" fill="#fff"/></svg><span>د غزې ښار</span></div>
      <div id="sig" class="lab sig" style="right:40px; top:60px;"><span class="dot"></span><span>الیاس عمر</span></div>
      <div id="caps" style="position:absolute;left:0;top:0;width:1080px;height:1920px;"></div>
    </div>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // Pashto subtitles (user-supplied translation); {…} = highlighted words
        const SUBS = [
          [0.0, 3.0, "ته زموږ د سر {تاج} یې، اې {ابو خالده}!"],
          [3.0, 6.0, "ته د ټول اسلامي امت د سر {تاج} یې."],
          [6.0, 8.5, "{الله} دې تا وساتي، ستا ساتنه دې وکړي او {برکت} دې درکړي."],
          [8.5, 11.5, "{الله} دې موږ او تاسو د نېکانو په ډله کې قبول کړي، {ان شاء الله}."],
          [11.5, 15.5, "{ان شاء الله}، لوی رب دې ستا قدر او عزت په {دنیا او اخرت} کې لوړ لري."],
          [16.5, 20.5, "له {الله} څخه غواړو چې زموږ او ستاسو نېک اعمال قبول کړي، {ان شاء الله}."],
          [21.0, 23.0, "{الله} دې تا وساتي، زما {ګرانه}!"],
        ];
        const host = document.getElementById("caps");
        SUBS.forEach(([a, b, spec], k) => {
          const cap = document.createElement("div"); cap.className = "cap"; host.appendChild(cap);
          const pill = document.createElement("span"); pill.className = "pill"; cap.appendChild(pill);
          const ws = [];
          spec.split(/(\{[^}]*\})/).filter(Boolean).forEach((chunk) => {
            const hl = chunk[0] === "{";
            const text = hl ? chunk.slice(1, -1) : chunk;
            if (!hl && /^[،.!؟]/.test(text) && pill.lastChild && pill.lastChild.nodeType === 3) pill.removeChild(pill.lastChild);
            text.trim().split(/\s+/).filter(Boolean).forEach((w) => {
              const s = document.createElement("span"); s.className = "w" + (hl ? " hl" : ""); s.textContent = w; pill.appendChild(s); ws.push(s);
              pill.appendChild(document.createTextNode(" "));
            });
          });
          const bar = document.createElement("span"); bar.className = "bar"; pill.appendChild(bar);
          const tIn = a + (k === 0 ? 0.15 : 0.05), tOut = b - 0.32, dur = tOut - tIn;
          // pill glides in, words bloom right→left, a gold line tracks the sentence, then a soft blur-out
          tl.fromTo(pill, { opacity: 0, y: 26, scale: 0.94, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, tIn);
          const step = Math.min(0.12, (dur * 0.45) / ws.length);
          ws.forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, tIn + 0.08 + i * step));
          ws.filter((w) => w.classList.contains("hl")).forEach((w, i) => tl.fromTo(w, { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, tIn + 0.5 + i * 0.15));
          tl.fromTo(bar, { scaleX: 0, opacity: 0.9 }, { scaleX: 1, duration: dur, ease: "none" }, tIn);
          tl.to(pill, { opacity: 0, y: -14, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, tOut);
        });
        // --- label replacements: fully opaque before the Arabic appears, gone only after it leaves ---
        tl.fromTo("#title", { opacity: 1, scale: 1 }, { opacity: 1, scale: 1, duration: 0.01 }, 0);
        tl.fromTo("#title .ln", { opacity: 0, x: 40, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 }, 0.05);
        tl.to("#title", { opacity: 0, y: -20, filter: "blur(8px)", duration: 0.35, ease: "power2.in" }, 7.85);
        tl.fromTo("#loc", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 8.05);
        tl.to("#loc", { opacity: 0, y: 10, duration: 0.3, ease: "power2.in" }, 16.05);
        tl.fromTo("#nameL", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 9.05);
        tl.fromTo("#role", { opacity: 0.0 }, { opacity: 1, duration: 0.2 }, 9.1);
        tl.to("#nameL", { opacity: 0, x: -30, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, 14.3);
        tl.fromTo("#sig", { opacity: 0, y: -16, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "power3.out" }, 0.4);
        tl.fromTo("#sig .dot", { scale: 1 }, { scale: 1.35, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 11, immediateRender: false }, 1.2);
        document.fonts.ready.then(() => { window.__timelines["main"] = tl; if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind(); });
      })();
    </script>
  </body>
</html>
